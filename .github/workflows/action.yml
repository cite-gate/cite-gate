name: action
on: [push, pull_request]
jobs:
  example-must-fail:
    # The example contains deliberate mistakes, so the action must exit non-zero on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          claims: examples/gettysburg/claims.json
      - name: expect failure
        run: |
          if [ "${{ steps.gate.outcome }}" != "failure" ]; then
            echo "the gate should have failed on the deliberate mistakes"; exit 1
          fi
  clean-must-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make a clean claims file from the passing items
        run: |
          python - <<'PY'
          import json
          d = json.load(open("examples/gettysburg/claims.json"))
          d["sections"] = d["sections"][:1]
          json.dump(d, open("examples/gettysburg/clean.json", "w"))
          PY
      - uses: ./
        with:
          claims: examples/gettysburg/clean.json
          strict: "true"
